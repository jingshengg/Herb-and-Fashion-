<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Herb & Fashion's traditional Chinese medicine and botanical wellness product catalogue.">
  <title>Featured Products | Herb &amp; Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Herb &amp; Fashion overview">
        <img class="brand-logo" src="images/company logo.png" alt="Cao Ben logo">
        <span class="brand-name">Herb <span class="plain-amp">&amp;</span> Fashion</span>
      </a>
      <button class="menu-button" type="button" aria-controls="site-menu" aria-expanded="false"><span></span><span></span><span></span><span class="sr-only">Open menu</span></button>
      <nav class="site-menu" id="site-menu" aria-label="Main navigation">
        <a href="index.html">Overview</a>
        <a href="about.html">About Us</a>
        <a class="active" aria-current="page" href="products.html">Featured Products</a>
        <a href="services.html">Our Services</a>
        <a href="events.html">Events</a>
        <a href="index.html#contact">Contact Us</a>
        <button class="language-toggle" type="button" aria-label="Switch language to Chinese" aria-pressed="false" data-language-toggle>
          <span class="language-option language-option-en" aria-hidden="true">EN</span>
          <span class="language-option language-option-zh" aria-hidden="true">中</span>
          <span class="language-toggle-thumb" aria-hidden="true"></span>
        </button>
      </nav>
    </div>
  </header>

  <main class="products-page">
    <section class="about-banner products-page-banner" aria-label="Featured Products banner">
      <h1 class="sr-only">Featured Products</h1>
      <img src="images/featured products banner.png" data-banner-zh="images/featured products chinese banner.png" alt="">
    </section>

    <section class="product-catalog-section" aria-label="Featured product catalogue">
      <div class="container product-catalog-container">
        <div class="product-toolbar">
          <div class="product-category-filters" role="group" aria-label="Filter products by category">
            <button type="button" class="category-filter-button" data-category-filter="heart-circulation" aria-pressed="false">Heart <span class="plain-amp">&amp;</span> Circulation</button>
            <button type="button" class="category-filter-button" data-category-filter="bones-joints" aria-pressed="false">Bones <span class="plain-amp">&amp;</span> Joints</button>
            <button type="button" class="category-filter-button" data-category-filter="sleep-stress" aria-pressed="false">Sleep <span class="plain-amp">&amp;</span> Stress</button>
            <button type="button" class="category-filter-button" data-category-filter="daily-vitality" aria-pressed="false">Daily Vitality</button>
          </div>

          <div class="product-view-toggle" role="group" aria-label="Product layout">
            <button type="button" class="view-toggle-button is-active" data-product-view="grid" aria-label="Grid view" aria-pressed="true"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i></button>
            <button type="button" class="view-toggle-button" data-product-view="list" aria-label="List view" aria-pressed="false"><i class="fa-solid fa-list" aria-hidden="true"></i></button>
          </div>

          <div class="product-sort-control">
            <label for="product-sort">Sort by</label>
            <select id="product-sort" name="sort">
              <option value="default">Default</option>
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="price-asc">Price (Low-High)</option>
              <option value="price-desc">Price (High-Low)</option>
            </select>
          </div>
        </div>

        <p class="product-results-count" data-product-count aria-live="polite">Loading products…</p>
        <div class="product-grid" data-product-grid aria-live="polite" aria-busy="true"></div>
        <p class="product-empty-state" data-product-empty hidden>No products are available in this category yet.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-content"><a class="footer-wordmark" href="index.html">Herb <span class="plain-amp">&amp;</span> Fashion</a><p>© 2026 Herb <span class="plain-amp">&amp;</span> Fashion Sdn. Bhd. 202301003104 (1497023-V)</p><a class="back-to-top" href="#top">Back to top <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></a></div></footer>
  <script src="js/product-data.js"></script>
  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
